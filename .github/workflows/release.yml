name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run CI checks
        run: make ci

      - name: Run tests
        run: make test

      - name: Build
        run: bun run build

      - name: Bundle runtime config
        # The config loader resolves global-config.yaml relative to the bundled
        # index.js (import.meta.dir), so the YAML must ship alongside it in dist/.
        run: cp src/config/global-config.yaml src/config/production-config.yaml dist/

      - name: Package build artifact
        run: tar -czf "bun-template-${GITHUB_REF_NAME}.tar.gz" -C dist .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: bun-template-*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
