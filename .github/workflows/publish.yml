name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for npm provenance and MCP registry GitHub OIDC login
    env:
      # Job-level env is available to step-level `if:` conditions; the `secrets`
      # context is not. Mapping the secret here lets steps gate on env.NPM_TOKEN.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Verify checks
        run: make ci

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Skip npm publish (no NPM_TOKEN)
        if: ${{ env.NPM_TOKEN == '' }}
        run: echo "NPM_TOKEN not set; skipping npm publish."

      - name: Install mcp-publisher
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar -xz mcp-publisher || echo "mcp-publisher download failed; run it manually."

      - name: Publish to the MCP registry
        run: |
          if [ -x ./mcp-publisher ]; then
            ./mcp-publisher login github-oidc || ./mcp-publisher login github || {
              echo "mcp-publisher login unavailable in this context; run 'mcp-publisher publish' manually."; exit 0; }
            ./mcp-publisher publish
          else
            echo "mcp-publisher not available; skipping."
          fi
